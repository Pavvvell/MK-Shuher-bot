name: Шуxер Lite quality checks
on:
  push:
    branches: [feature/simple-sheets-bot]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: shuher_simple
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -r requirements.txt
      - name: Compile
        run: python -m compileall -q app.py store.py natural.py business.py dialogue.py media.py company.py knowledge.py projects.py tests
      - name: Unit tests
        run: python -m unittest discover -s tests -v
