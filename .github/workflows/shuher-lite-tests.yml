name: Shuher Lite workflow checks

on:
  push:
    branches:
      - feature/simple-sheets-bot
    paths:
      - "shuher_simple/**"
      - ".github/workflows/shuher-lite-tests.yml"
  workflow_dispatch:

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: shuher_simple
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Syntax check
        run: python -m compileall -q app.py store.py business.py
      - name: Offline business tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
